name: Build iStoreOS for RK3568 EasePi R1

on:
  push:
    branches:
      - istoreos-24.10
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils bzip2 diff find flex gawk gcc-10 getopt grep install libc-dev libz-dev \
            make perl python3 rsync subversion unzip which build-essential \
            libncurses5-dev zlib1g-dev gzip libffi-dev libssl-dev cmake git wget curl time \
            device-tree-compiler quilt asciidoc

      - name: Clone and configure
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build for RK3568 EasePi R1
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_easepi-r1=y
          CONFIG_TARGET_BOARD="rockchip"
          CONFIG_TARGET_SUBTARGET="armv8"
          CONFIG_TARGET_PROFILE="easepi-r1"
          EOF

      - name: Build firmware
        run: |
          make defconfig
          make download -j8
          make -j$(nproc)

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: iStoreOS-RK3568-EasePi-R1-firmware
          path: bin/targets/rockchip/armv8/
          retention-days: 30
