name: Build iStoreOS for RK3568 EasePi R1

on:
  push:
    branches:
      - istoreos-24.10
  workflow_dispatch:

concurrency:
  group: easepi-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2 python3.6 python3 python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo pip install pyelftools

      - name: Update feeds
        run: |
          # OpenWrt reads feeds.conf (or feeds.conf.default), not the
          # repository-specific feeds.conf.mydefault file.
          cp feeds.conf.mydefault feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for feed in h69k_oled lcdsimple third_party diskman oaf linkease_nas linkease_nas_luci jjm2473_apps; do
            test -d "feeds/$feed" || {
              echo "Expected feed is unavailable: $feed" >&2
              exit 1
            }
          done

      - name: Configure and validate firmware
        run: |
          cp config.default .config
          make defconfig
          required_symbols=(
            CONFIG_TARGET_rockchip_armv8_DEVICE_easepi_r1
            CONFIG_PACKAGE_dropbear
            CONFIG_PACKAGE_uhttpd
            CONFIG_PACKAGE_uhttpd-mod-ubus
            CONFIG_PACKAGE_rpcd
            CONFIG_PACKAGE_rpcd-mod-luci
            CONFIG_PACKAGE_luci
            CONFIG_PACKAGE_luci-mod-admin-full
            CONFIG_PACKAGE_luci-mod-network
            CONFIG_PACKAGE_luci-mod-status
            CONFIG_PACKAGE_luci-mod-system
            CONFIG_PACKAGE_istoreos-files
            CONFIG_PACKAGE_kmod-rk_vcodec
            CONFIG_PACKAGE_kmod-rockchip-opp-select
            CONFIG_PACKAGE_kmod-rockchip-system-monitor
            CONFIG_PACKAGE_linkease
            CONFIG_PACKAGE_luci-app-linkease
            CONFIG_PACKAGE_luci-app-quickstart
            CONFIG_PACKAGE_luci-app-diskman
            CONFIG_PACKAGE_luci-app-oaf
            CONFIG_PACKAGE_luci-i18n-linkease-zh-cn
            CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn
            CONFIG_PACKAGE_quickstart
          )
          for symbol in "${required_symbols[@]}"; do
            grep -qx "${symbol}=y" .config || {
              echo "Required firmware option is missing: ${symbol}=y" >&2
              exit 1
            }
          done
          test "$(grep -Ec '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y$' .config)" -eq 1

      - name: Build firmware
        run: |
          make download -j8
          make V=s -j$(nproc)

      - name: Validate firmware artifacts
        run: |
          image="bin/targets/rockchip/armv8/istoreos-rockchip-armv8-easepi_r1-squashfs-sysupgrade.img.gz"
          test -s "$image"
          sha256sum "$image"
          manifest="$(find bin/targets/rockchip/armv8 -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          test -s "$manifest"
          required_packages=(
            linkease
            luci-app-linkease
            luci-app-diskman
            luci-app-oaf
            luci-app-quickstart
            luci-app-store
            luci-i18n-linkease-zh-cn
            luci-i18n-quickstart-zh-cn
            quickstart
          )
          for package in "${required_packages[@]}"; do
            grep -q "^${package} - " "$manifest" || {
              echo "Required package is absent from the firmware manifest: $package" >&2
              exit 1
            }
          done

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-RK3568-EasePi-R1-firmware
          path: bin/targets/rockchip/armv8/
          retention-days: 30
